application:
  development: true
  log_level: debug

server:
  api:
    host: 0.0.0.0
    port: 8080
    network: tcp4 # tcp | tcp4 | tcp6

    read_header_timeout: 2s
    read_timeout: 15s
    write_timeout: 15s
    idle_timeout: 120s

    max_header_bytes: 65536
    max_header_value_count: 0
    disable_general_options_handler: false
    disable_keep_alives: false
    disable_client_priority: false
    shutdown_timeout: 30s

    protocols:
      http1: true
      http2: true
      unencrypted_http2: false

    http2:
      max_concurrent_streams: 250
      max_decoder_header_table_size: 4096
      max_encoder_header_table_size: 4096
      max_read_frame_size: 1048576
      max_receive_buffer_per_connection: 1048576
      max_receive_buffer_per_stream: 262144
      send_ping_timeout: 30s
      ping_timeout: 10s
      write_byte_timeout: 10s

    tcp_keep_alive:
      enable: true
      idle: 30s
      interval: 10s
      count: 5

  debug:
    host: 0.0.0.0
    port: 8081
    network: tcp4

    read_header_timeout: 1s
    read_timeout: 3s
    write_timeout: 3s
    idle_timeout: 60s

    max_header_bytes: 16384
    shutdown_timeout: 10s

    protocols:
      http1: true
      http2: false

gymstation:
  host: gym-s.ru
  timeout: 30s
  dial_timeout: 10s
  keep_alive: 30s
  tls_handshake_timeout: 20s
  response_header_timeout: 15s
  max_idle_conns: 100
  idle_conn_timeout: 90s
  expect_continue_timeout: 1s
  force_attempt_http2: true
  user_agent: GymStation-Go-Client/1.0 (SorryForTheLoad)

cron:
  location: Local
  stop_timeout: 15s
  jobs:
    - name: gymstation-site-parser
      mask: "0 30 * * * *"
    - name: delete-expired-schedules
      mask: "0 0 0 * * *"
